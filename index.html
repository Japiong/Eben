<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9f5ff; /* A soft, light blue */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .calculator-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
            box-sizing: border-box;
        }

        h1 {
            color: #0056b3; /* A deep blue for the heading */
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #0056b3;
        }
        
        button:active {
            transform: translateY(2px);
        }

        #result {
            margin-top: 30px;
            font-size: 22px;
            font-weight: bold;
            color: #0056b3;
            min-height: 30px; /* Reserve space to prevent layout shift */
        }

        .error-message {
            color: #dc3545; /* Red for errors */
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <h1>Week Calculator</h1>
        <div class="input-group">
            <label for="startDate">Start Date:</label>
            <input type="date" id="startDate">
        </div>
        <div class="input-group">
            <label for="endDate">End Date:</label>
            <input type="date" id="endDate">
        </div>
        <button onclick="calculateWeeks()">Calculate Weeks</button>
        <p id="result"></p>
    </div>

    <script>
        function calculateWeeks() {
            const startDateInput = document.getElementById('startDate').value;
            const endDateInput = document.getElementById('endDate').value;
            const resultElement = document.getElementById('result');

            // Clear previous result and error messages
            resultElement.textContent = "";
            resultElement.classList.remove('error-message');

            // Check if both dates are provided
            if (!startDateInput || !endDateInput) {
                resultElement.textContent = "Please select both a start and an end date.";
                resultElement.classList.add('error-message');
                return;
            }

            // Create Date objects from the input strings
            const startDate = new Date(startDateInput);
            const endDate = new Date(endDateInput);

            // Calculate the difference in milliseconds
            const timeDifference = endDate.getTime() - startDate.getTime();

            // Check for an invalid date range
            if (timeDifference < 0) {
                resultElement.textContent = "End date must be after the start date.";
                resultElement.classList.add('error-message');
                return;
            }

            // Calculate the number of full weeks
            const millisecondsInWeek = 1000 * 60 * 60 * 24 * 7;
            const numberOfWeeks = Math.floor(timeDifference / millisecondsInWeek);

            resultElement.textContent = `Number of full weeks: ${numberOfWeeks}`;
        }
    </script>
</body>
</html>
